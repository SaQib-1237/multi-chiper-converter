<!doctype html>
<html>
  <head>
    <title>Cipher Converter</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>🔐 Cipher Converter</h1>

      <form method="POST">
        <textarea
          name="text"
          placeholder="Enter your text..."
          required
        ></textarea>

        <select name="option">
          <option value="caesar">Caesar Cipher</option>
          <option value="atbash">Atbash Cipher</option>
          <option value="base64">Base64 Encode</option>
          <option value="binary">Binary</option>
          <option value="reverse">Reverse</option>
        </select>

        <input type="number" name="shift" placeholder="Shift (for Caesar)" />

        <button type="submit">Convert</button>
      </form>

      {% if result %}
      <div class="result">
        <h3>Result:</h3>
        <p>{{ result }}</p>
      </div>
      {% endif %}
    </div>
  </body>
</html>
