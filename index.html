<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Cipher Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🔐 Multi Cipher Converter</h1>

      <textarea id="text" placeholder="Enter your text..."></textarea>

      <select id="option">
        <option value="caesar">Caesar Cipher</option>
        <option value="atbash">Atbash Cipher</option>
        <option value="base64">Base64 Encode</option>
        <option value="binary">Binary</option>
        <option value="reverse">Reverse Text</option>
      </select>

      <input type="number" id="shift" placeholder="Shift (only for Caesar)" />

      <button onclick="convert()">Convert</button>

      <div class="result">
        <h3>Result</h3>
        <p id="output"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
